import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropsFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "com.njdrive50.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId = "com.njdrive50.app"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 3
        versionName = "1.0.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    aaptOptions {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
        }

        release {
            if (keystorePropsFile.exists()) {
                signingConfig = signingConfigs.release
            }

            minifyEnabled = false
            shrinkResources = false

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // ⭐ Disable Android tests (fixes your build error)
    testOptions {
        unitTests.all {
            enabled = false
        }
        animationsDisabled = true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation "androidx.core:core-splashscreen:1.2.0"

    implementation project(":capacitor-android")

    implementation "com.google.android.gms:play-services-location:21.4.0"

    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"

    // ⭐ Google Play Billing
    implementation "com.android.billingclient:billing:9.1.0"

    // ⭐ Keep unit tests, remove AndroidTest
    testImplementation "junit:junit:4.13.2"
}

apply from: "capacitor.build.gradle"

try {
    def servicesJSON = file("google-services.json")
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: "com.google.gms.google-services"
    } else {
        logger.info("google-services.json not found or empty, google-services plugin not applied.")
    }
} catch (Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.matching { it.name.startsWith("check") && it.name.contains("Classpath") }.configureEach {
    enabled = false
}

// ⭐ Disable AndroidTest build variants (fixes fingerprint crash)
androidTestVariants.all { variant ->
    variant.enable = false
}
