# Project-wide Gradle settings

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.dependency.useConstraints=false

# Gradle daemon JVM.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Restrict Gradle Java toolchain discovery to the same complete JDK/JBR.
# This prevents Gradle from selecting VS Code Red Hat Java extension's
# incomplete runtime, which does not contain bin/jlink.exe.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr